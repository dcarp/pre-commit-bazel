name: Tests
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install . -r requirements-dev.txt
      - uses: bazel-contrib/setup-bazel@f34d6a05eae3c24acab7fa54587492daeaeffdab # 0.19.2
        if: matrix.python == '3.14'
        with:
          module-root: tests/fixture
          bazelisk-cache: true
          repository-cache: true
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s tests -p test_runners.py -k test_real_bazel -v
        if: matrix.python == '3.14'
        env:
          BAZEL_REAL_TESTS: '1'
