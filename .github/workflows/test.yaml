name: Tests
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install . -r requirements-dev.txt
      - uses: bazel-contrib/setup-bazel@f34d6a05eae3c24acab7fa54587492daeaeffdab # 0.19.2
        if: matrix.python == '3.14'
        with:
          module-root: tests/fixture
          bazelisk-cache: true
          repository-cache: true
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s tests -p test_runners.py -k test_real_bazel -v
        if: matrix.python == '3.14'
        env:
          BAZEL_REAL_TESTS: '1'
